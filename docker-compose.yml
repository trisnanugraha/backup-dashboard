# Backup Monitoring v2 — berjalan paralel dengan Node-RED (tidak menyentuhnya).
#   docker compose up -d                 -> mysql + api
#   docker compose --profile n8n up -d   -> + n8n (kalau belum punya instance n8n)

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?isi MYSQL_ROOT_PASSWORD di .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-backup_monitoring}
      MYSQL_USER: ${MYSQL_USER:?isi MYSQL_USER di .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?isi MYSQL_PASSWORD di .env}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      API_PORT: 3000
      TZ: ${TIMEZONE:-Asia/Jakarta}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    profiles: ["n8n"]
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: ${TIMEZONE:-Asia/Jakarta}
      TZ: ${TIMEZONE:-Asia/Jakarta}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports:
      - "5678:5678"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  n8n-data:
